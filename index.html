<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard UPT Performance Cashier</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <!-- PapaParse for CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        /* CSS Watermark Panda Background */
        .watermark-panda {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            max-width: 650px;
            height: auto;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.3s ease;
        }
        .dark .watermark-panda {
            opacity: 0.08;
        }

        #dashboardContent {
            position: relative;
            z-index: 10;
        }

        .custom-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #6366f1 100%);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
        }

        .kpi-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
        .kpi-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4) !important;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #818cf8;
        }

        table tbody tr {
            transition: background-color 0.2s ease;
        }
        table tbody tr:hover {
            background-color: rgba(99, 102, 241, 0.05) !important;
        }

        /* Animation Modal */
        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal {
            animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Leaderboard Item Hover Effect */
        .lb-item {
            transition: all 0.2s ease-in-out;
        }
        .lb-item:hover {
            transform: translateX(4px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- ELEMEN WATERMARK PANDA BACKGROUND -->
    <img src="watermark.png" alt="Watermark Panda" class="watermark-panda" />

    <!-- MODAL LOGIN KEREN -->
    <div id="loginModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-700 w-full max-w-sm p-6 relative overflow-hidden animate-modal text-center">
            
            <!-- Ornamen Dekorasi Gelombang -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-500/10 rounded-full blur-xl pointer-events-none"></div>

            <!-- Logo Panda di Modal -->
            <div class="mx-auto w-24 h-24 mb-3 flex items-center justify-center rounded-2xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 shadow-inner p-2">
                <img src="watermark.png" alt="Logo Panda" class="max-h-full object-contain filter drop-shadow" />
            </div>

            <h3 class="text-xl font-extrabold text-slate-800 dark:text-white">Selamat Datang! 👋</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 mb-5">Masukkan PIN Otentikasi untuk melanjutkan ke Dashboard UPT Performance.</p>

            <form onsubmit="handleLoginSubmit(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">PIN / Password</label>
                    <div class="relative">
                        <input type="password" id="modalPasswordInput" placeholder="••••••••" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition text-slate-800 dark:text-white font-mono">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs font-semibold">
                            👁️
                        </button>
                    </div>
                </div>

                <div id="loginErrorMsg" class="hidden text-xs text-rose-500 font-medium bg-rose-50 dark:bg-rose-950/50 p-2 rounded-lg text-center border border-rose-200 dark:border-rose-900">
                    ❌ PIN yang kamu masukkan salah!
                </div>

                <div class="space-y-2 pt-1">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-md transition transform active:scale-95 text-sm flex items-center justify-center gap-2">
                        <span>🔑</span> Masuk Dashboard
                    </button>
                    
                    <button type="button" onclick="loginAsGuest()" class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200 font-semibold py-2 px-4 rounded-xl transition text-xs flex items-center justify-center gap-1.5">
                        <span>👤</span> Masuk Publik (Guest Mode)
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div id="dashboardContent" class="pb-12">
        <!-- HEADER NAVBAR -->
        <header class="custom-header text-white px-6 py-5 mb-6">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-wide flex items-center gap-2">
                        <span>📊</span> Dashboard Performa UPT Kasir
                    </h1>
                    <div class="flex flex-wrap items-center gap-2 mt-1">
                        <p class="text-xs opacity-90">Monitoring Capaian UPT Per Toko & Staff</p>
                        <span id="roleBadge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-indigo-900/80 text-indigo-200 border border-indigo-400/30">Guest</span>
                        <span class="opacity-40">•</span>
                        <!-- JAM & TANGGAL REALTIME -->
                        <div class="text-xs font-mono bg-white/10 backdrop-blur-md px-2.5 py-0.5 rounded-md border border-white/20 text-indigo-100 flex items-center gap-1.5">
                            <span>🕒</span> <span id="clockText">Memuat waktu...</span>
                        </div>
                    </div>
                </div>

                <!-- RIGHT CONTROLS -->
                <div class="flex flex-wrap items-center gap-2">
                    <button type="button" onclick="exportStaffToCSV()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-1.5 px-3 rounded-lg shadow-md transition text-xs flex items-center gap-1">
                        📥 Export Rekap (CSV)
                    </button>
                    
                    <a id="linkGoogleForm" href="#" target="_blank" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-1.5 px-3 rounded-lg shadow-md transition text-xs flex items-center gap-1">
                        📝 Input Form
                    </a>
                    <a id="linkDatabaseSheet" href="#" target="_blank" class="hidden bg-teal-600 hover:bg-teal-700 text-white font-semibold py-1.5 px-3 rounded-lg shadow-md transition text-xs flex items-center gap-1">
                        📊 Database
                    </a>
                    <button id="darkModeToggle" onclick="toggleDarkMode()" class="text-xs font-medium bg-white/10 hover:bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/20 transition flex items-center gap-1.5">
                        <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
                    </button>
                    <button type="button" onclick="showLoginModal()" class="text-xs font-semibold bg-amber-400 hover:bg-amber-300 text-slate-900 px-3 py-1.5 rounded-lg shadow-md transition border border-amber-300">
                        🔑 Switch Access
                    </button>
                </div>
            </div>
        </header>

        <!-- MAIN CONTAINER -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 space-y-6">

            <!-- SLICERS / FILTER BAR -->
            <div class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Bulan & Tahun</label>
                    <input type="month" id="filterBulanTahun" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Kategori Grup Toko</label>
                    <select id="filterKategori" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="">Semua Kategori</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Asst. Branch Manager (ABM)</label>
                    <select id="filterABM" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="">Semua ABM</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Branch Manager (BM)</label>
                    <select id="filterBM" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm focus:ring-2Tentu, berikut adalah daftar **Indeks Saham Utama di Bursa Efek Indonesia (BEI)** yang paling sering menjadi acuan. Memantau indeks-indeks ini sangat berguna ketika sedang menyusun strategi investasi jangka panjang, terutama dalam mengelola keuangan untuk tujuan besar di masa depan seperti persiapan memiliki hunian idaman. 

Berikut adalah tabel rinciannya beserta penjelasan singkat:

| Nama Indeks | Penjelasan Singkat | Karakteristik & Fokus Utama |
| :--- | :--- | :--- |
| **IHSG** (Indeks Harga Saham Gabungan) | Mengukur pergerakan harga dari seluruh saham yang tercatat di papan utama maupun papan pengembangan BEI. | Merupakan barometer atau indikator utama pergerakan pasar modal di Indonesia secara keseluruhan. |
| **LQ45** | Terdiri dari 45 saham perusahaan yang memiliki tingkat likuiditas tertinggi dan kapitalisasi pasar yang sangat besar. | Sering dijadikan acuan utama untuk memantau saham-saham *blue-chip* yang pergerakannya relatif lebih stabil. |
| **IDX30** | Versi yang lebih terkurasi dari LQ45, mengukur kinerja 30 saham dengan likuiditas paling tinggi dan fundamental paling solid. | Menjadi tolok ukur ketat bagi para investor yang fokus murni pada saham-saham berkapitalisasi raksasa. |
| **SRI-KEHATI** | Mengukur kinerja 25 saham dari perusahaan yang terbukti menerapkan prinsip tata kelola yang baik, serta peduli terhadap lingkungan dan sosial. | Sangat cocok bagi yang memiliki perhatian pada investasi berkelanjutan dan prinsip ESG (*Environmental, Social, and Governance*). |
| **IDX HIDIV20** | Memantau kinerja 20 saham yang memiliki rekam jejak rutin membagikan dividen dengan imbal hasil (*yield*) tinggi selama 3 tahun terakhir. | Relevan untuk strategi investasi yang berfokus pada penciptaan arus kas tambahan atau *passive income*. |

Memahami karakteristik masing-masing indeks ini bisa sangat membantu saat memutuskan alokasi dana, baik secara langsung ke saham maupun melalui instrumen reksa dana indeks, agar sejalan dengan target waktu pencapaian dana tersebut. 

Karena istilah "indeks" memiliki cakupan yang cukup luas, apakah indeks pasar modal ini yang sedang ingin dieksplorasi, atau ada indeks spesifik lain—seperti indeks katalog produk atau metrik performa digital—yang sebenarnya sedang dibutuhkan?
